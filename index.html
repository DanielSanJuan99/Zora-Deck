<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Zora Deck</title>
    <link rel="stylesheet" href="./index.css">
  </head>

  <body>

    <header class="custom-header">
      <div class="drag-region">
        <span class="title">Zora Deck</span>
      </div>

      <div class="window-controls">
        <button id="minimize" class="control-btn">─</button>
        <button id="maximize" class="control-btn">▢</button>
        <button id="close" class="control-btn close">✕</button>
      </div>
    </header>

    <nav class="menu-bar">

      <div class="menu-item-container">
        <button class="menu-btn" id="btn-profile">Profile</button>
        <div class="menu-dropdown">
          <button id="menu-settings">Settings</button>
        </div>
      </div>

      <div class="menu-item-container">
        <button class="menu-btn">Workshop</button>
        <div class="menu-dropdown">
          <button id="menu-explore">Explore</button>
          <button id="menu-addons">Addons</button>
        </div>
      </div>

    </nav>

    <main class="main-content">
      
      <div id="deck-hub" class="deck-grid">
        
        <div class="deck-item" data-deck="1">
          <div class="deck-content">
            <div class="deck-icon">🎴</div>
            <h3>Deck 1</h3>
            <p>Configurar comandos y macros</p>
          </div>
          <div class="deck-footer">Habilitado</div>
        </div>

        <div class="deck-item" data-deck="2">
          <div class="deck-content">
            <div class="deck-icon">🎴</div>
            <h3>Deck 2</h3>
            <p>Configurar comandos y macros</p>
          </div>
          <div class="deck-footer">Habilitado</div>
        </div>

        <div class="deck-item" data-deck="3">
          <div class="deck-content">
            <div class="deck-icon">🎴</div>
            <h3>Deck 3</h3>
            <p>Configurar comandos y macros</p>
          </div>
          <div class="deck-footer">Habilitado</div>
        </div>

        <div class="deck-item" data-deck="4">
          <div class="deck-content">
            <div class="deck-icon">🎴</div>
            <h3>Deck 4</h3>
            <p>Configurar comandos y macros</p>
          </div>
          <div class="deck-footer">Habilitado</div>
        </div>

      </div>

    </main>

    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
