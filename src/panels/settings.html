<div class="settings-popup">
  <div class="settings-header">
    <span>Ajustes</span>
    <button class="control-btn close" data-close-panel>✕</button>
  </div>

  <div class="settings-body">
    <aside class="settings-sidebar">
      <div class="sidebar-item active" data-tab="general">General</div>
      <div class="sidebar-item" data-tab="conexion">Conexión</div>
      <div class="sidebar-item" data-tab="servicios">Servicios</div>
    </aside>

    <section class="settings-main-content">
      
      <div id="tab-general" class="settings-section">
        <div class="config-group">
          <label class="main-label-extended">Ajustes Generales</label>
        </div>
        <div class="config-box">
          <p style="text-align: center; color: #888; font-size: 13px; margin: 20px 0;">
            Configuraciones de la aplicación y preferencias de interfaz.
          </p>
        </div>
      </div>

      <div id="tab-conexion" class="settings-section hidden">
        <div class="config-group">
          <label class="main-label-extended">Conexión con OBS Websocket</label>
        </div>

        <div class="config-box">
          <h4>Configuración de Red</h4>
          
          <div class="config-row">
            <label for="obs-ip">Dirección IP:</label>
            <input type="text" id="obs-ip" class="settings-input" value="127.0.0.1" spellcheck="false">
          </div>

          <div class="config-row">
            <label for="obs-port">Puerto:</label>
            <input type="number" id="obs-port" class="settings-input" value="4455">
          </div>

          <div class="config-row">
            <label for="obs-password">Contraseña:</label>
            <input type="password" id="obs-password" class="settings-input" placeholder="••••••••">
          </div>
        </div>

        <div class="settings-footer-actions">
          <span id="obs-status-msg" class="status-label status-disconnected">Desconectado</span>
          <button id="btn-connect-obs" class="obs-button">Conectar</button>
        </div>
      </div>

      <div id="tab-servicios" class="settings-section hidden">
        <div class="config-group">
          <label class="main-label-extended">Servicios de Streaming</label>
        </div>

        <div class="config-box">
          <h4>Integración de Twitch</h4>
          <div class="config-row" style="justify-content: space-between; align-items: center; padding: 5px 0;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span style="color: #a970ff; font-weight: bold; font-size: 14px;">Twitch TV</span>
              <span style="color: #888; font-size: 11px;">Vincular cuenta para chat y eventos en vivo.</span>
            </div>
            <button id="btn-auth-twitch" class="obs-button">Vincular Cuenta</button>
          </div>
        </div>

        <div class="config-box" style="margin-top: 20px;">
          <h4>Integración de Kick</h4>
          <div class="config-row" style="justify-content: space-between; align-items: center; padding: 5px 0;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span style="color: #53fc18; font-weight: bold; font-size: 14px;">Kick.com</span>
              <span style="color: #888; font-size: 11px;">Vincular cuenta para chat y alertas de Kick.</span>
            </div>
            <button id="btn-auth-kick" class="obs-button kick-btn">Vincular Cuenta</button>
          </div>
        </div>
      </div>

    </section>
  </div>
</div>
